<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <!-- Strawberry -->
    <g id="strawberry">
      <path d="M0,-4 C11,-4 17,7 11,17 C7,24 -7,24 -11,17 C-17,7 -11,-4 0,-4 Z"/>
      <path d="M-6,-4 C-8,-9 -3,-11 0,-8 C3,-11 8,-9 6,-4"/>
      <path d="M-5,3 l1,3 M0,2 l1,4 M5,3 l1,3 M-3,10 l1,3 M3,10 l1,3"/>
    </g>
    <!-- Cherries -->
    <g id="cherries">
      <path d="M-1,-15 C4,-21 12,-18 12,-12"/>
      <circle cx="-6" cy="10" r="8"/>
      <circle cx="7" cy="5" r="8"/>
    </g>
    <!-- Pineapple -->
    <g id="pineapple">
      <path d="M-2,-16 l-5,-7 M0,-17 l0,-8 M2,-16 l5,-7"/>
      <path d="M-11,-6 h22 a11,15 0 0 1 -22,0 Z"/>
      <path d="M-11,-6 l22,16 M11,-6 l-22,16 M-11,2 l22,0" opacity="0.8"/>
    </g>
    <!-- Watermelon slice -->
    <g id="watermelon">
      <path d="M-14,10 A14,14 0 0 1 14,10 Z"/>
      <path d="M-11,10 A11,11 0 0 1 11,10" opacity="0.8"/>
      <circle cx="-4" cy="2" r="1"/>
      <circle cx="4" cy="2" r="1"/>
      <circle cx="0" cy="6" r="1"/>
    </g>
    <!-- Orange slice -->
    <g id="orange">
      <circle cx="0" cy="0" r="13"/>
      <path d="M0,-13 V13 M-11.3,-6.5 L11.3,6.5 M-11.3,6.5 L11.3,-6.5"/>
    </g>
    <!-- Banana -->
    <g id="banana">
      <path d="M-11,10 C-14,-4 -6,-16 8,-17 C9,-14 7,-12 4,-11 C-4,-8 -8,2 -6,11 C-3,15 3,15 7,11"/>
      <path d="M7,11 c2,2 1,5 -2,5"/>
    </g>
    <!-- Apple -->
    <g id="apple">
      <path d="M0,-6 C8,-10 15,-3 14,6 C13,15 5,20 0,20 C-5,20 -13,15 -14,6 C-15,-3 -8,-10 0,-6 Z"/>
      <path d="M0,-6 v-6 M0,-12 q4,-3 6,-1"/>
    </g>
    <!-- Grapes -->
    <g id="grapes">
      <path d="M0,-16 v5"/>
      <circle cx="-5" cy="-6" r="5"/>
      <circle cx="5" cy="-6" r="5"/>
      <circle cx="-8" cy="4" r="5"/>
      <circle cx="0" cy="6" r="5"/>
      <circle cx="8" cy="4" r="5"/>
      <circle cx="-4" cy="14" r="5"/>
      <circle cx="4" cy="14" r="5"/>
    </g>
    <!-- Pear -->
    <g id="pear">
      <path d="M0,-14 v4"/>
      <path d="M0,-10 C5,-10 6,-5 4,-2 C11,2 12,12 4,17 C-1,20 -8,18 -10,11 C-12,4 -8,0 -4,-2 C-6,-5 -5,-10 0,-10 Z"/>
    </g>
    <!-- Kiwi slice -->
    <g id="kiwi">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="0" cy="0" r="8" opacity="0.7"/>
      <circle cx="0" cy="-4" r="1"/>
      <circle cx="3.5" cy="-1" r="1"/>
      <circle cx="3.5" cy="3" r="1"/>
      <circle cx="0" cy="5.5" r="1"/>
      <circle cx="-3.5" cy="3" r="1"/>
      <circle cx="-3.5" cy="-1" r="1"/>
    </g>
    <!-- Peach -->
    <g id="peach">
      <path d="M0,-8 v-4 M0,-12 q3,-3 5,-1"/>
      <path d="M0,-8 C9,-9 14,-1 12,7 C10,16 2,19 0,19 C-2,19 -10,16 -12,7 C-14,-1 -9,-9 0,-8 Z"/>
      <path d="M0,-8 C1,0 1,10 0,19" opacity="0.6"/>
    </g>
    <!-- Lemon -->
    <g id="lemon">
      <path d="M-14,0 C-14,-7 -7,-11 0,-11 C7,-11 14,-7 14,0 C14,7 7,11 0,11 C-7,11 -14,7 -14,0 Z"/>
      <path d="M-14,0 q-3,0 -4,0 M14,0 q3,0 4,0"/>
    </g>
  </defs>

  <g fill="none" stroke="#A3A3A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.62">
    <use href="#strawberry" x="45" y="40" transform="rotate(-8 45 40) scale(1.15)"/>
    <use href="#orange" x="145" y="45" transform="scale(1.1)"/>
    <use href="#pineapple" x="245" y="40" transform="rotate(5 245 40) scale(1.15)"/>
    <use href="#cherries" x="345" y="45" transform="rotate(10 345 45) scale(1.1)"/>

    <use href="#banana" x="90" y="130" transform="rotate(-10 90 130) scale(1.15)"/>
    <use href="#kiwi" x="195" y="130" transform="rotate(8 195 130) scale(1.15)"/>
    <use href="#watermelon" x="300" y="135" transform="rotate(-6 300 135) scale(1.2)"/>
    <use href="#pear" x="400" y="135" transform="rotate(-4 400 135) scale(1.1)"/>

    <use href="#grapes" x="40" y="225" transform="rotate(6 40 225) scale(1.1)"/>
    <use href="#apple" x="150" y="225" transform="rotate(-5 150 225) scale(1.15)"/>
    <use href="#peach" x="255" y="225" transform="scale(1.1)"/>
    <use href="#lemon" x="360" y="225" transform="rotate(12 360 225) scale(1.1)"/>

    <use href="#cherries" x="65" y="315" transform="rotate(-6 65 315) scale(1.1)"/>
    <use href="#strawberry" x="170" y="320" transform="rotate(10 170 320) scale(1.1)"/>
    <use href="#orange" x="270" y="315" transform="rotate(-4 270 315) scale(1.05)"/>
    <use href="#banana" x="375" y="320" transform="rotate(14 375 320) scale(1.1)"/>

    <use href="#pineapple" x="100" y="405" transform="rotate(-6 100 405) scale(1.1)"/>
    <use href="#watermelon" x="210" y="405" transform="rotate(5 210 405) scale(1.15)"/>
    <use href="#grapes" x="315" y="400" transform="rotate(-8 315 400) scale(1.05)"/>
    <use href="#kiwi" x="415" y="405" transform="scale(1.05)"/>
  </g>
</svg>
