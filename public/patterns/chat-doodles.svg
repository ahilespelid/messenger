<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <g id="star" stroke-linejoin="round">
      <path d="M0,-11 L2.6,-3.4 L10.5,-3.4 L4.1,1.3 L6.5,9 L0,4.2 L-6.5,9 L-4.1,1.3 L-10.5,-3.4 L-2.6,-3.4 Z"/>
    </g>
    <g id="heart">
      <path d="M0,8 C-9,0 -10,-6 -5,-9 C-2,-10.5 0,-8 0,-5 C0,-8 2,-10.5 5,-9 C10,-6 9,0 0,8 Z"/>
    </g>
    <g id="cup">
      <path d="M-7,-4 h12 v7 a6,6 0 0 1 -6,6 h0 a6,6 0 0 1 -6,-6 Z"/>
      <path d="M5,-2 q6,0 6,4 q0,4 -6,4"/>
      <path d="M-3,-10 q1,-2 0,-4 M0,-10 q1,-2 0,-4 M3,-10 q1,-2 0,-4"/>
    </g>
    <g id="plane">
      <path d="M-10,4 L10,-8 L1,3 L4,9 L0,5 L-4,7 Z"/>
    </g>
    <g id="umbrella">
      <path d="M-10,0 a10,9 0 0 1 20,0 Z"/>
      <path d="M0,0 v12 q0,3 -3,3"/>
    </g>
    <g id="balloon">
      <path d="M0,-9 a7,8 0 1 1 -0.1,0 Z"/>
      <path d="M0,-1 L-1.5,3 L1.5,5 L-1,9"/>
    </g>
    <g id="gift">
      <rect x="-8" y="-2" width="16" height="12" rx="1"/>
      <path d="M-8,3 h16"/>
      <path d="M0,-2 v12"/>
      <path d="M0,-2 c-2,-6 -8,-6 -6,-1 c1,2 4,1 6,1 c2,0 5,1 6,-1 c2,-5 -4,-5 -6,1 Z"/>
    </g>
    <g id="cloud">
      <path d="M-9,3 a5,5 0 0 1 0,-10 a6,6 0 0 1 11,-2 a5,5 0 0 1 3,9.5 a4,4 0 0 1 -1,2.5 Z"/>
    </g>
    <g id="note">
      <circle cx="-5" cy="7" r="3.2"/>
      <path d="M-1.8,7 V-9 l7,2 v9"/>
    </g>
    <g id="leaf">
      <path d="M-8,8 C-8,-4 4,-9 9,-9 C9,-2 4,8 -8,8 Z"/>
      <path d="M-8,8 C-4,2 2,-3 9,-9"/>
    </g>
    <g id="snow">
      <path d="M0,-10 V10 M-8.7,-5 L8.7,5 M-8.7,5 L8.7,-5"/>
      <path d="M0,-10 l-2,3 M0,-10 l2,3 M0,10 l-2,-3 M0,10 l2,-3"/>
    </g>
    <g id="moon">
      <path d="M4,-9 a10,10 0 1 0 0,18 a8,8 0 0 1 0,-18 Z"/>
    </g>
    <g id="flower">
      <circle cx="0" cy="-6" r="3"/>
      <circle cx="5.2" cy="-3" r="3"/>
      <circle cx="5.2" cy="3" r="3"/>
      <circle cx="0" cy="6" r="3"/>
      <circle cx="-5.2" cy="3" r="3"/>
      <circle cx="-5.2" cy="-3" r="3"/>
      <circle cx="0" cy="0" r="2.6"/>
    </g>
    <g id="cherry">
      <path d="M-2,-9 C2,-13 8,-11 8,-7"/>
      <circle cx="-4" cy="6" r="5"/>
      <circle cx="5" cy="3" r="5"/>
    </g>
    <g id="cat">
      <path d="M-8,3 a8,8 0 1 0 16,0 a8,8 0 1 0 -16,0 Z"/>
      <path d="M-6,-4 L-8,-11 L-1,-6 Z"/>
      <path d="M6,-4 L8,-11 L1,-6 Z"/>
      <circle cx="-3" cy="2" r="1"/>
      <circle cx="3" cy="2" r="1"/>
      <path d="M-2,6 q2,2 4,0"/>
    </g>
    <g id="fish">
      <path d="M-9,0 C-6,-6 4,-6 9,0 C4,6 -6,6 -9,0 Z"/>
      <path d="M9,0 l5,-4 v8 Z"/>
      <circle cx="-5" cy="-1" r="1"/>
    </g>
    <g id="bell">
      <path d="M0,-9 a6,6 0 0 1 6,6 v3 q0,3 3,4 h-18 q3,-1 3,-4 v-3 a6,6 0 0 1 6,-6 Z"/>
      <path d="M-3,6 a3,3 0 0 0 6,0"/>
    </g>
  </defs>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <use href="#star" x="40" y="35" transform="rotate(-8 40 35)"/>
    <use href="#heart" x="150" y="30" transform="rotate(6 150 30) scale(0.9)"/>
    <use href="#cup" x="260" y="45" transform="rotate(-4 260 45)"/>
    <use href="#plane" x="360" y="30" transform="rotate(10 360 30)"/>
    <use href="#umbrella" x="440" y="70" transform="scale(0.85)"/>

    <use href="#balloon" x="90" y="110" transform="rotate(-5 90 110)"/>
    <use href="#cloud" x="200" y="115" transform="scale(1.05)"/>
    <use href="#gift" x="310" y="115" transform="rotate(5 310 115)"/>
    <use href="#note" x="420" y="140" transform="rotate(-8 420 140)"/>

    <use href="#leaf" x="30" y="190" transform="rotate(20 30 190)"/>
    <use href="#snow" x="140" y="195" transform="scale(0.8)"/>
    <use href="#moon" x="250" y="185" transform="rotate(15 250 185)"/>
    <use href="#flower" x="365" y="200"/>
    <use href="#star" x="455" y="215" transform="scale(0.75)"/>

    <use href="#cherry" x="70" y="270" transform="rotate(-10 70 270)"/>
    <use href="#cat" x="190" y="270"/>
    <use href="#fish" x="300" y="265" transform="rotate(8 300 265)"/>
    <use href="#bell" x="410" y="275" transform="scale(0.85)"/>

    <use href="#heart" x="40" y="345" transform="scale(0.75)"/>
    <use href="#cup" x="130" y="350" transform="rotate(6 130 350) scale(0.85)"/>
    <use href="#plane" x="230" y="340" transform="rotate(-12 230 340)"/>
    <use href="#umbrella" x="330" y="350" transform="rotate(6 330 350) scale(0.8)"/>
    <use href="#gift" x="430" y="355" transform="scale(0.8)"/>

    <use href="#note" x="90" y="420" transform="scale(0.9)"/>
    <use href="#leaf" x="200" y="425" transform="rotate(-25 200 425)"/>
    <use href="#flower" x="300" y="430" transform="scale(0.8)"/>
    <use href="#star" x="400" y="430" transform="rotate(12 400 430)"/>
  </g>
</svg>
