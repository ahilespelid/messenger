services:
  app:
    build: .
    image: messenger-app
    restart: unless-stopped
    command: ["app"]
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [messenger]

  reverb:
    build: .
    image: messenger-app
    restart: unless-stopped
    command: ["reverb"]
    env_file: .env
    # The base image's inherited healthcheck probes FrankenPHP's Caddy admin
    # API, which this service never runs (it's a bare `reverb:start`, no
    # Caddy) — without this it would sit "unhealthy" forever despite working.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    networks: [messenger]

  queue:
    build: .
    image: messenger-app
    restart: unless-stopped
    command: ["queue"]
    env_file: .env
    healthcheck:
      disable: true
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [messenger]

  db:
    image: percona/percona-server:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-messenger}
      MYSQL_USER: ${DB_USERNAME:-messenger}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [messenger]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [messenger]

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  storage:

networks:
  messenger:
    driver: bridge
